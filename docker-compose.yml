services:
  postgres:
    image: postgres:17
    container_name: job-queue-db
    environment:
      POSTGRES_DB: jobqueue
      POSTGRES_USER: jobqueue_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobqueue_user -d jobqueue"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: