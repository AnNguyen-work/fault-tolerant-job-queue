
services:
  postgres:
    image: postgres:17
    container_name: job-queue-db
    environment:
      POSTGRES_DB: jobqueue
      POSTGRES_USER: jobqueue_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobqueue_user -d jobqueue"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+pg8000://jobqueue_user:local_dev_password@postgres:5432/jobqueue
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker1:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+pg8000://jobqueue_user:local_dev_password@postgres:5432/jobqueue
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker2:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+pg8000://jobqueue_user:local_dev_password@postgres:5432/jobqueue
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
